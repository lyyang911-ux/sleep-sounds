<style>
:root{
  --spring:cubic-bezier(.32,.72,0,1);
  --spring-bounce:cubic-bezier(.34,1.46,.64,1);
  --g:#23A165; --g-lt:#7FDCA9; --y:#E3A21A; --y-lt:#FFD877; --r:#D9483B; --r-lt:#FF9A8B;
  --paper:#FAF7F0; --paper2:#F2ECDF; --card:#FFFFFF;
  --ink:#16140F; --ink2:#4B463C; --muted:#8E8677;
  --line:#E8E0CF; --line2:#F1EBDF;
  --gold:#B8912F; --gold-dk:#8A6A17; --gold-lt:#E6C979; --gold-soft:#F7EFD9; --gold-line:#E6D3A2;
  --black:#15130F;
  --snore:#C46A24; --snore-lt:#F2B27A; --snore-soft:#FBEBDD;
  --talk:#7C5CD6; --talk-lt:#B9A5F5; --talk-soft:#EEEAFB;
  --noise:#78808C; --noise-lt:#C3C8CF; --noise-soft:#EDEFF2;
  --pause:#D9483B;
  --rad:20px;
  --shadow:0 1px 2px rgba(40,30,10,.05),0 12px 32px rgba(40,30,10,.07);
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
  --serif:Georgia,"Songti SC","STSong","Times New Roman",serif;
  --bgimg:radial-gradient(700px 380px at 12% -120px,rgba(241,205,140,.5),transparent 70%),radial-gradient(600px 360px at 95% 8%,rgba(160,150,235,.26),transparent 70%),radial-gradient(700px 500px at 5% 65%,rgba(150,180,235,.14),transparent 70%),radial-gradient(700px 500px at 100% 95%,rgba(241,190,150,.18),transparent 70%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;min-height:100vh;background-image:var(--bgimg);background-attachment:fixed;background-repeat:no-repeat}
[hidden]{display:none!important}
button{font-family:var(--sans);color:inherit;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.sec{font-size:.82em;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:.01em}

/* header */
header.top{padding:calc(14px + env(safe-area-inset-top)) 0 4px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:40px;height:40px;border-radius:12px;background:var(--black);display:grid;place-items:center;box-shadow:0 6px 16px rgba(20,18,16,.2);flex:0 0 auto}
.mark svg{width:22px;height:22px}
.brand h1{margin:0;font-family:var(--serif);font-size:21px;letter-spacing:-.015em;line-height:1.08;white-space:nowrap}
.brand small{display:block;font-size:10px;letter-spacing:.2em;white-space:nowrap;color:var(--gold-dk);font-weight:700;margin-top:3px}
.hdrR{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.iconBtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:var(--shadow);transition:transform .18s var(--spring)}
.iconBtn:active{transform:scale(.92)}
.iconBtn svg{width:19px;height:19px}
#langSw{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--shadow)}
#langSw button{border:0;background:none;font-weight:600;font-size:13px;color:var(--muted);padding:7px 12px;border-radius:999px}
#langSw button.on{background:var(--black);color:var(--gold-lt)}
@media(max-width:370px){.brand small{letter-spacing:.14em}#langSw button{padding:7px 9px}}

/* tabs */
.tabs{position:sticky;top:0;z-index:20;background:rgba(250,247,240,.82);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);margin:6px -16px 0;padding:8px 16px}
.tabs::after{content:"";position:absolute;left:0;right:0;top:100%;height:16px;background:linear-gradient(180deg,rgba(250,247,240,.75),rgba(250,247,240,0));pointer-events:none}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper2);border-radius:14px;padding:4px;position:relative;isolation:isolate}
.seg .ind{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px)/3);background:var(--card);border-radius:11px;box-shadow:0 2px 8px rgba(40,30,10,.1);transition:transform .45s var(--spring);z-index:-1;will-change:transform}
.seg button{border:0;background:none;padding:9px 0;border-radius:11px;font-weight:700;font-size:14px;color:var(--ink2);transition:transform .18s var(--spring),color .25s ease}
.seg button span{font-size:11px;color:var(--muted);font-weight:500;margin-left:4px}
.seg button.on{color:var(--ink)}
.seg button:active{transform:scale(.96)}
main{padding:10px 0 40px}
body.has-badge main{padding-bottom:110px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.kicker{font-size:10.5px;letter-spacing:.18em;color:var(--gold-dk);font-weight:700;text-transform:uppercase}
.kicker.lt{color:var(--gold-lt)}
.cardHead{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.cardHead h3{margin:0;font-family:var(--serif);font-size:18px;letter-spacing:-.012em;line-height:1.25}
.cardHead .muted{font-size:12.5px;white-space:nowrap}

lative;overflow:hidden;box-shadow:0 18px 40px rgba(20,18,30,.25);margin-bottom:14px}
.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,rgba(230,201,121,.22),transparent 70%);pointer-events:none}
.hero>*{position:relative;z-index:1}
.heroTop{display:flex;justify-content:space-between;align-items:center}
.hClock{font-variant-numeric:tabular-nums;color:#d8cfbb;font-size:13px;font-weight:600}
.hero h2{font-family:var(--serif);font-size:25px;line-height:1.2;letter-spacing:-.022em;margin:16px 0 6px;font-weight:600}
.heroP{font-size:13.5px;color:#d9d2c2;line-height:1.6;margin:0 0 18px;max-width:38ch}
.startBtn{width:100%;display:flex;align-items:center;gap:14px;border:0;border-radius:18px;padding:13px 16px;background:linear-gradient(135deg,#F3DC92,#CDA544 55%,#A88227);color:#16130c;text-align:left;box-shadow:0 10px 26px rgba(201,161,62,.35),inset 0 1px 0 rgba(255,255,255,.55);transition:transform .2s var(--spring),box-shadow .2s ease}
.startBtn:active{transform:scale(.97);box-shadow:0 4px 12px rgba(201,161,62,.3)}
.startBtn .ic{width:46px;height:46px;border-radius:50%;background:#16130c;color:var(--gold-lt);display:grid;place-items:center;flex:0 0 auto}
.startBtn .ic svg{width:22px;height:22px}
.startBtn b{display:block;font-size:18px;letter-spacing:-.012em;line-height:1.25}
.startBtn small{display:block;font-size:12px;opacity:.72;font-weight:600}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.hchip{border:1px solid rgba(230,201,121,.32);background:rgba(255,255,255,.07);color:#e9e2cf;border-radius:999px;padding:6px 11px;font-size:12px;transition:transform .18s var(--spring)}
.hchip:active{transform:scale(.95)}
.hchip b{color:var(--gold-lt);font-weight:700}

/* ring */
.ring{position:relative;width:112px;height:112px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);display:block}
.ring .arc{transition:stroke-dashoffset .9s var(--spring),stroke .4s ease}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;align-content:center}
.ring b{font-family:var(--serif);font-size:32px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring small{display:block;font-size:10.5px;color:var(--muted);margin-top:5px;letter-spacing:.05em}
.ring.sm{width:88px;height:88px}.ring.sm b{font-size:26px}
.c-g{color:var(--g)}.c-y{color:#B97F06}.c-r{color:var(--r)}
.dark .c-g{color:var(--g-lt)}.dark .c-y{color:var(--y-lt)}.dark .c-r{color:var(--r-lt)}
.dark .ring small{color:#b9b09c}

.sumRow{display:flex;gap:16px;align-items:center}
.sumStats{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px;flex:1;min-width:0}
.sumStats b{display:block;font-family:var(--serif);font-size:19px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.sumStats small{font-size:11px;color:var(--muted)}
.linkBtn{margin-top:14px;width:100%;border:1px solid var(--gold-line);background:var(--gold-soft);color:var(--gold-dk);font-weight:700;font-size:14px;padding:11px;border-radius:13px;transition:transform .18s var(--spring)}
.linkBtn:active{transform:scale(.98)}
.cS{color:var(--snore)}.cT{color:var(--talk)}.cN{color:var(--noise)}.cP{color:var(--pause)}

/* tips */
.tips{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.tips li{display:grid;grid-template-columns:34px 1fr;gap:11px;align-items:start;font-size:13.5px;color:var(--ink2);line-height:1.5}
.tips .ti{width:34px;height:34px;border-radius:11px;background:var(--gold-soft);display:grid;place-items:center;font-size:16px}
.privacy{font-size:12.5px;color:var(--muted);text-align:center;margin:6px 8px 0;line-height:1.6}

/* nights list */
.nItem{width:100%;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .2s var(--spring)}
.nItem:active{transform:scale(.98)}
.nItem .d b{font-family:var(--serif);font-size:17px;letter-spacing:-.012em}
.nItem .d small{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.nItem .chipsRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--paper2);color:var(--ink2);white-space:nowrap}
.mini.s{background:var(--snore-soft);color:var(--snore)}.mini.t{background:var(--talk-soft);color:var(--talk)}.mini.p{background:#FBE4E1;color:var(--pause)}
.score{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score.g{background:#E3F5EB;color:#157048}.score.y{background:#FFF3D3;color:#94650A}.score.r{background:#FBE4E1;color:#B0362B}.score.n{background:var(--paper2);color:var(--muted);font-size:15px}
.empty{text-align:center;padding:34px 18px;color:var(--muted);font-size:14px;line-height:1.6}
.empty .big{font-size:44px;margin-bottom:6px}

/* trends */
.avgs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.avg{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:10px 6px;text-align:center;box-shadow:var(--shadow)}
.avg b{display:block;font-family:var(--serif);font-size:20px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.avg small{font-size:10.5px;color:var(--muted);line-height:1.3;display:block}
.bars{display:flex;align-items:flex-end;gap:5px;padding-top:6px}
.bars .col{flex:1;display:block;min-width:0;border:0;background:none;padding:0;text-align:center;transition:transform .18s var(--spring)}
.bars .col:active{transform:scale(.94)}
.bars .bt{height:122px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.bars .col i{display:block;width:100%;max-width:26px;border-radius:7px 7px 3px 3px;transform-origin:bottom;animation:grow .7s var(--spring) both}
.bars .col span{font-size:10.5px;font-weight:700;margin-bottom:3px;font-variant-numeric:tabular-nums}
.bars .col em{display:block;font-style:normal;font-size:9.5px;color:var(--muted);margin-top:5px;white-space:nowrap}
@keyframes grow{from{transform:scaleY(0)}}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink2);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* report panel */
#report{position:fixed;inset:0;z-index:40;background:var(--paper);background-image:var(--bgimg);overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;transform:translateX(100%);visibility:hidden;transition:transform .5s var(--spring),visibility 0s linear .5s}
#report.open{transform:none;visibility:visible;transition:transform .5s var(--spring),visibility 0s}
.rTop{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(250,247,240,.85);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%)}
.back{border:0;background:none;display:flex;align-items:center;gap:2px;font-weight:700;font-size:15px;color:var(--gold-dk);padding:6px 4px}
.back svg{width:20px;height:20px}
.rTitle{text-align:center;min-width:0}
.rTitle b{font-family:var(--serif);font-size:16px;display:block;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rTitle small{font-size:12px;color:var(--muted)}
.gm{font-family:var(--serif);font-size:15px;color:var(--gold-dk);margin:4px 2px 10px}
.hero.dark{background:linear-gradient(160deg,#1b1813,#0e0d0a);border-color:#2e291f}
.scoreRow{display:flex;gap:16px;align-items:center}
.scoreRow h2{margin:0 0 4px;font-size:21px}
.band{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;color:#15130F;margin-bottom:8px}
.band.g{background:var(--g-lt)}.band.y{background:var(--y-lt)}.band.r{background:var(--r-lt)}.band.n{background:#cfc8b8}
.verd{font-size:13px;color:#d6cfbf;line-height:1.55;margin:0}
.ded{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.ded span{font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.08);color:#e7dfcc;border:1px solid rgba(255,255,255,.1)}
.ded span b{color:var(--r-lt);margin-left:3px}
.ded span.ok b{color:var(--g-lt)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 13px;box-shadow:var(--shadow);border-top:3px solid var(--line)}
.st small{display:block;font-size:11.5px;color:var(--muted);font-weight:600;line-height:1.35}
.st b{display:block;font-family:var(--serif);font-size:22px;letter-spacing:-.02em;margin-top:5px;font-variant-numeric:tabular-nums;line-height:1.15}
.st em{display:block;font-style:normal;font-size:12px;color:var(--ink2);margin-top:2px}
.st.s{border-top-color:var(--snore)}.st.t{border-top-color:var(--talk)}.st.p{border-top-color:var(--pause)}.st.n{border-top-color:var(--noise)}.st.q{border-top-color:var(--g)}.st.k{border-top-color:var(--gold)}

.tl{position:relative;margin-top:6px}

.tlx{position:relative;height:18px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.adv{list-style:none;margin:0;padding:0;display:grid;gap:12px}

.adv li b{color:var(--ink)}
.adv .ai{font-size:18px;line-height:1.3}

/* clips */
.fchips{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 6px}
.fchip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 11px;font-size:12.5px;font-weight:700;color:var(--ink2);transition:transform .18s var(--spring)}
.fchip:active{transform:scale(.95)}
.fchip.on{background:var(--black);border-color:var(--black);color:var(--gold-lt)}
.playAll{margin-left:auto;border:0;background:var(--gold-soft);color:var(--gold-dk);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:5px}
.playAll svg{width:13px;height:13px}
.clip{display:grid;grid-template-columns:42px 1fr 34px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line2);scroll-margin:90px}
.clip.flash{animation:flash 1.2s ease}
@keyframes flash{0%,40%{background:var(--gold-soft)}100%{background:transparent}}
.pbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--black);color:var(--gold-lt);display:grid;place-items:center;transition:transform .18s var(--spring),background .2s}
.pbtn:active{transform:scale(.9)}
.pbtn svg{width:16px;height:16px}
.pbtn:disabled{background:var(--paper2);color:var(--muted)}
.clip.playing .pbtn{background:var(--gold);color:#fff}
.cTop{display:flex;align-items:center;gap:7px;font-size:13px;flex-wrap:wrap}
.cTop b{font-variant-numeric:tabular-nums;font-size:14px}
.cTop .cd{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.pill{border:0;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:3px}
.pill.snore{background:var(--snore-soft);color:var(--snore)}.pill.talk{background:var(--talk-soft);color:var(--talk)}.pill.noise{background:var(--noise-soft);color:var(--noise)}
.pill .auto{font-weight:500;opacity:.7}
.int{font-size:11px;color:var(--muted)}
.wave{height:24px;margin-top:6px;display:flex;align-items:center;gap:2px}
.wave i{flex:1;background:var(--c,var(--muted));border-radius:2px;min-height:2px;opacity:.35;transition:opacity .15s}
.wave i.on{opacity:1}
.star{border:0;background:none;color:var(--line);padding:4px;display:grid;place-items:center;transition:transform .25s var(--spring-bounce)}
.star svg{width:22px;height:22px}
.star.on{color:var(--gold)}
.star:active{transform:scale(.8)}
.moreBtn{width:100%;margin-top:8px;border:1px dashed var(--line);background:none;border-radius:12px;padding:10px;font-weight:600;color:var(--ink2);font-size:13px}
.danger{color:var(--r)!important}
.delBtn{width:100%;border:1px solid #f0cfc9;background:#fff7f5;color:var(--r);font-weight:700;border-radius:14px;padding:12px;font-size:14px;margin-top:4px}
.disc{font-size:11.5px;color:var(--muted);line-height:1.6;text-align:center;margin:14px 6px calc(30px + env(safe-area-inset-bottom))}

/* menu */
.menu{position:fixed;z-index:70;background:rgba(255,255,255,.94);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--line);border-radius:15px;box-shadow:0 18px 44px rgba(30,20,10,.2);padding:6px;width:220px;animation:pop .3s var(--spring) both}

.menu button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:10px;border-radius:10px;font-size:14px;text-align:left;color:var(--ink)}
.menu button:active,.menu button:hover{background:var(--paper2)}
.menu button.cur{font-weight:700}
.menu button .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.menu hr{border:0;border-top:1px solid var(--line2);margin:4px 6px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s linear .45s}
#sheet.open{visibility:visible;transition:none}
#sheet .scrim{position:absolute;inset:0;background:rgba(20,16,8,.38);opacity:0;transition:opacity .35s ease}
#sheet.open .scrim{opacity:1}
#sheet .box{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:90vh;overflow-y:auto;background:var(--paper);border-radius:26px 26px 0 0;padding:8px 18px calc(26px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .45s var(--spring);box-shadow:0 -10px 40px rgba(20,16,8,.2)}

.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 12px}
.sheetHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheetHead h3{margin:0;font-family:var(--serif);font-size:20px;letter-spacing:-.015em}
.done{border:0;background:var(--black);color:var(--gold-lt);font-weight:700;border-radius:999px;padding:8px 16px;font-size:14px}
.row{padding:14px 0;border-bottom:1px solid var(--line2)}
.row:last-child{border-bottom:0}
.row label{display:block;font-weight:700;font-size:14.5px;margin-bottom:8px}
.row p{margin:8px 0 0;font-size:12.5px;color:var(--muted);line-height:1.55}
.sseg{display:flex;background:var(--paper2);border-radius:12px;padding:3px;gap:3px}
.sseg button{flex:1;border:0;background:none;padding:8px 2px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink2);transition:background .25s,color .25s,transform .18s var(--spring)}
.sseg button:active{transform:scale(.95)}
.sseg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(40,30,10,.1)}
.btn2{width:100%;border:1px solid var(--line);background:var(--card);border-radius:13px;padding:12px;font-weight:700;font-size:14px;box-shadow:var(--shadow);transition:transform .18s var(--spring)}
.btn2:active{transform:scale(.98)}

/* night screen */
#night{position:fixed;inset:0;z-index:100;background:#000;color:#b8a671;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none;touch-action:manipulation;overflow:hidden}
#night .face{display:flex;flex-direction:column;align-items:center;opacity:.26;transition:opacity .7s ease,transform 3s ease;will-change:transform}
#night.awake .face{opacity:1}
.nClock{font-size:72px;font-weight:200;letter-spacing:-.035em;font-variant-numeric:tabular-nums;line-height:1}
.nSub{font-size:14px;color:#8f8462;margin-top:12px;text-align:center;line-height:1.55;max-width:300px}
.nCounts{display:flex;gap:22px;margin-top:22px;font-size:12px;color:#7d735a;text-align:center}
.nCounts b{font-size:22px;display:block;font-weight:400;color:#b8a671;font-variant-numeric:tabular-nums}
.nMeter{width:170px;height:3px;background:#17150e;border-radius:3px;margin-top:24px;overflow:hidden}
.nMeter i{display:block;height:100%;width:0;background:#7a6a3d;transition:width .3s linear}
.nMeter.hot i{background:#c49a3a}
.nWarn{margin-top:20px;font-size:12.5px;color:#c98f6a;text-align:center;max-width:300px;line-height:1.5}
.nHint{position:absolute;bottom:calc(26px + env(safe-area-inset-bottom));font-size:12px;color:#3b3626;transition:opacity .5s}
#night.awake .nHint{opacity:0}
.nCtl{position:absolute;bottom:calc(36px + env(safe-area-inset-bottom));left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity .45s ease}
#night.awake .nCtl{opacity:1;pointer-events:auto}
.hold{position:relative;width:92px;height:92px;border-radius:50%;border:0;background:#15130d;color:#E6C979;display:grid;place-items:center;font-size:12px;font-weight:700;line-height:1.3;text-align:center;transition:transform .2s var(--spring);touch-action:none}
.hold:active{transform:scale(.94)}
.hold svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.hold .arc{stroke-dasharray:283;stroke-dashoffset:283;transition:stroke-dashoffset .25s ease}
.hold.on .arc{stroke-dashoffset:0;transition:stroke-dashoffset 1.4s linear}
.nLink{border:0;background:none;color:#8f8462;font-size:13px;text-decoration:underline;text-underline-offset:3px}
.resume{margin-top:22px;border:0;border-radius:999px;background:#E6C979;color:#15130d;font-weight:700;font-size:16px;padding:14px 26px}

#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:rgba(21,19,15,.92);color:#F5F1E6;font-size:14px;padding:11px 18px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .3s,transform .4s var(--spring);z-index:200;max-width:calc(100% - 32px);text-align:center;line-height:1.5}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.has-badge #toast{bottom:96px}

@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;transition-duration:.15s!important}

  #sheet .box{transform:none;opacity:0;transition:opacity .2s}
  #sheet.open .box{opacity:1}
}
@media(prefers-reduced-transparency:reduce){

}
@media(prefers-contrast:more){
  .card,.st,.nItem,.avg{border-color:#9d927a}

}

const DB={db:null,
 open(){return new Promise((res,rej)=>{const r=indexedDB.open('sleep-sounds',1);
  r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('nights',{keyPath:'id'});
   const c=d.createObjectStore('clips',{keyPath:'id',autoIncrement:true});c.createIndex('night','night');
   d.createObjectStore('audio',{keyPath:'id'})};
  r.onsuccess=()=>{DB.db=r.result;res()};r.onerror=()=>rej(r.error)})},
 tx(st,mode,fn){return new Promise((res,rej)=>{const x=DB.db.transaction(st,mode);let out;const r=fn(x.objectStore(st));
  if(r)r.onsuccess=()=>{out=r.result};x.oncomplete=()=>res(out);x.onerror=()=>rej(x.error);x.onabort=()=>rej(x.error)})},
 put(s,v){return DB.tx(s,'readwrite',o=>o.put(v))},
 get(s,k){return DB.tx(s,'readonly',o=>o.get(k))},
 all(s){return DB.tx(s,'readonly',o=>o.getAll())},
 del(s,k){return DB.tx(s,'readwrite',o=>o.delete(k))},
 byNight(id){return DB.tx('clips','readonly',o=>o.index('night').getAll(id))},
 clear(s){return DB.tx(s,'readwrite',o=>o.clear())}
};

function envOf(pcm,floor){

/* 分类：鼾声 = 低频为主、一阵一阵有规律（跟着呼吸）；梦话 = 中高频、有音节节奏；其余 = 噪音 */
function classify(fr0,thr){

// 单独一声、很短的鼾：如果 30 秒内刚打过鼾、频谱也像鼾声，就当作鼾声
function contextFix(c,prev){
  if(c.auto==='noise'&&c.feat.v<.45&&prev&&prev.auto==='snore'&&c.t0-(prev.t0+prev.dur*1000)<30000&&c.feat.lo>.4&&c.feat.cen<700)c.auto='snore';

async function storeClip(nightId,c,pcm){

function computeStats(n,clips){

  let snoreS=0,w=0,light=0,loud=0,epic=0,talkS=0,talkEp=0,talkN=0,noiseN=0,lastTalk=-1e15,keptS=0;
  for(const c of cs){keptS+=c.dur;const l=L(c);
    if(l==='snore'){snoreS+=c.dur;if(c.mean>=25){epic+=c.dur;w+=3*c.dur}else if(c.mean>=15){loud+=c.dur;w+=2*c.dur}else{light+=c.dur;w+=c.dur}}
    else if(l==='talk'){talkS+=c.dur;talkN++;if(c.t0-lastTalk>60000)talkEp++;lastTalk=c.t0+c.dur*1000}
    else noiseN++}
  const sn=cs.filter(c=>L(c)==='snore');let pauses=0;const pauseAt=[];
  for(let i=0;i<sn.length-1;i++){const a=sn[i],b=sn[i+1],gap=(b.as-a.ae)/1000;
    const run=a.dur>=6||(i>0&&a.as-sn[i-1].ae<90000);
    if(gap>=10&&gap<=90&&run&&b.peak>=a.peak-1){pauses++;pauseAt.push(a.ae+gap*500)}}
  let lq=0,prev=t0;for(const c of cs){lq=Math.max(lq,c.t0-prev);prev=Math.max(prev,c.t0+c.dur*1000)}lq=Math.max(lq,t1-prev);
  const snorePct=bedMs?Math.min(1,snoreS*1000/bedMs):0,snoreIdx=hrs>0?Math.round(w/60/hrs*3):0;
  let score=null;const ded=[];
  if(hrs>=1){
    const d=[['snore',Math.min(35,Math.round(snoreIdx*.5))],['pause',Math.min(25,pauses*3)],['talk',Math.min(12,talkEp*3)],
      ['noise',Math.min(12,Math.round(Math.max(0,noiseN/hrs-1)*2))],['short',hrs<6?Math.min(20,Math.round((6-hrs)*6)):0]];
    for(const x of d)if(x[1]>0)ded.push(x);
    score=Math.max(0,100-ded.reduce((a,x)=>a+x[1],0));
  }
  const totMs=Math.max(1,t1-n.start);
  return{bedMs,hrs,snoreS,snorePct,snoreIdx,light,loud,epic,talkS,talkEp,talkN,noiseN,pauses,pauseAt,lq,score,ded,keptS,removed:Math.max(0,1-keptS*1000/totMs),count:cs.length};
}
const pickStats=s=>({score:s.score,bedMs:s.bedMs,snorePct:s.snorePct,snoreIdx:s.snoreIdx,talkEp:s.talkEp,pauses:s.pauses,noiseN:s.noiseN,keptS:s.keptS});

const Rec={on:false};
async function lockWake(){try{if('wakeLock' in navigator){Rec.wl=await navigator.wakeLock.request('screen');Rec.wakeOk=true}else Rec.wakeOk=false}catch(e){Rec.wakeOk=false}}

async function startRec(){
  if(Rec.on)return;
  if(!window.isSecureContext){toast(t('notSecure'),5000);return}
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast(t('noMic'),5000);return}
  let stream;try{stream=await getMic()}catch(e){toast(t('micDenied'),6000);return}
  const AC=window.AudioContext||window.webkitAudioContext,ctx=new AC();try{await ctx.resume()}catch(e){}
  const src=ctx.createMediaStreamSource(stream),proc=ctx.createScriptProcessor(4096,1,1),mute=ctx.createGain();mute.gain.value=0;
  src.connect(proc);proc.connect(mute);mute.connect(ctx.destination);
  const start=Date.now(),thr=SENS_DB[SET.sens]||12;
  const night={id:start,start,end:null,delay:SET.delay*60000,thr,sens:SET.sens,levels:[],gaps:[],updated:start,autoStop:SET.autoStop*3600000,counts:{snore:0,talk:0,noise:0}};
  await DB.put('nights',night);
  const eng=new Engine({inRate:ctx.sampleRate,thr,startTime:start,onClip:onLiveClip});
  Object.assign(Rec,{on:true,night,eng,ctx,stream,src,proc,mute,pend:new Set(),prev:null,ticks:0});
  proc.onaudioprocess=e=>{
    const x=e.inputBuffer.getChannelData(0),bufMs=x.length/ctx.sampleRate*1000,g0=eng.timeAt(eng.n),g=Date.now()-bufMs-g0;
    if(g>5000){night.gaps.push([Math.round(g0),Math.round(g0+g)]);eng.gap(g)}

}
function onLiveClip(c,pcm){

  contextFix(c,Rec.prev);Rec.prev=c;n.counts[c.auto]++;
  const p=storeClip(n.id,c,pcm).catch(e=>console.error(e));Rec.pend.add(p);p.finally(()=>Rec.pend.delete(p));
}
function tick(){

  $('#nSub').innerHTML=(left>0?t('waiting',{m:Math.ceil(left/60000)}):t('listening')+' · '+t('recFor',{d:durHM(now-n.start)}))+
    (n.autoStop?'<br>'+t('autoEnd',{t:hm(n.start+n.autoStop)}):'');
  $('#nSkip').hidden=left<=0;

  const rel=Math.max(0,Math.min(40,Rec.eng.rel||0));$('#nMeter i').style.width=(rel/40*100)+'%';$('#nMeter').classList.toggle('hot',!!Rec.eng.ev);
  const gm=Math.round(n.gaps.reduce((a,g)=>a+g[1]-g[0],0)/60000);
  const warn=[];if(Rec.wakeOk===false)warn.push(t('noWake'));if(gm>0)warn.push(t('gapWarn',{m:gm}));

  const tr=Rec.stream.getAudioTracks()[0],broken=!tr||tr.readyState==='ended'||(Rec.ctx.state!=='running'&&document.visibilityState==='visible');
  $('#nResume').hidden=!broken;
  if(Rec.ticks%60===0){const f=$('#nFace');f.style.transform=`translate(${Math.round(Math.random()*40-20)}px,${Math.round(Math.random()*80-40)}px)`}
  if(Rec.ticks%30===0){n.levels=Rec.eng.curLevels();n.updated=now;DB.put('nights',n).catch(()=>{})}
  if(n.autoStop&&now-n.start>=n.autoStop)stopRec();
}
async function resumeRec(){
  try{
    const tr=Rec.stream.getAudioTracks()[0];
    if(!tr||tr.readyState==='ended'){const s=await getMic();try{Rec.src.disconnect()}catch(e){}
      Rec.stream=s;Rec.src=Rec.ctx.createMediaStreamSource(s);Rec.src.connect(Rec.proc)}

  }catch(e){toast(t('micDenied'),5000)}
}

async function importFile(file){
  closeSheet();toast(t('analyzing',{p:0}),0);
  let ab;
  try{const buf=await file.arrayBuffer();
    try{const O=window.OfflineAudioContext||window.webkitOfflineAudioContext;ab=await new O(1,SR,SR).decodeAudioData(buf.slice(0))}
    catch(e){const ac=new(window.AudioContext||window.webkitAudioContext)();ab=await ac.decodeAudioData(buf);try{ac.close()}catch(_){}}}
  catch(e){toast(e&&e.name==='RangeError'?t('tooLong'):t('decodeFail'),5000);return}
  const durMs=ab.duration*1000,end=file.lastModified||Date.now(),start=Math.round(end-durMs),thr=SENS_DB[SET.sens]||12;
  const night={id:start,start,end:Math.round(end),delay:0,thr,sens:SET.sens,levels:[],gaps:[],updated:Math.round(end),autoStop:0,counts:{snore:0,talk:0,noise:0},imported:file.name};
  let prev=null;const q=[];
  const eng=new Engine({inRate:ab.sampleRate,thr,startTime:start,onClip:(c,p)=>{contextFix(c,prev);prev=c;night.counts[c.auto]++;q.push(storeClip(night.id,c,p))}});
  const x=ab.getChannelData(0),CH=Math.round(ab.sampleRate*30);
  for(let i=0;i<x.length;i+=CH){eng.feed(x.subarray(i,i+CH));toast(t('analyzing',{p:Math.round(i/x.length*100)}),0);await sleep(0)}
  eng.flush();await Promise.all(q);night.levels=eng.levels;
  await DB.put('nights',night);await finalize(night);await retention();
  toast(t('analyzing',{p:100}));render();openReport(night.id);
  return night.id;
}

const player=new Audio();player.preload='auto';player.setAttribute('playsinline','');
const Play={id:null,queue:[],url:null};
function wavOf(i16){
  let pk=1;for(let i=0;i<i16.length;i++){const v=Math.abs(i16[i]);if(v>pk)pk=v}
  const g=Math.min(20,29000/pk),n=i16.length*2,b=new ArrayBuffer(44+n*2),v=new DataView(b),R=16000;
  const ws=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  ws(0,'RIFF');v.setUint32(4,36+n*2,true);ws(8,'WAVE');ws(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,R,true);v.setUint32(28,R*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);ws(36,'data');v.setUint32(40,n*2,true);
  const cl=x=>x>32767?32767:x<-32768?-32768:x|0;
  for(let i=0,o=44;i<i16.length;i++){const a=i16[i]*g,c=(i+1<i16.length?(i16[i]+i16[i+1])/2:i16[i])*g;v.setInt16(o,cl(a),true);o+=2;v.setInt16(o,cl(c),true);o+=2}
  return new Blob([b],{type:'audio/wav'});
}
async function clipBlob(id){const a=await DB.get('audio',id);return a?wavOf(new Int16Array(a.pcm)):null}
async function playClip(id){
  const b=await clipBlob(id);if(!b)return false;
  if(Play.url)URL.revokeObjectURL(Play.url);Play.url=URL.createObjectURL(b);Play.id=id;
  player.src=Play.url;try{await player.play()}catch(e){return false}
  markPlaying();return true;
}
function stopPlay(){player.pause();Play.id=null;Play.queue=[];markPlaying()}
async function togglePlay(id){if(Play.id===id&&!player.paused){stopPlay();return}Play.queue=[];await playClip(id)}

player.addEventListener('timeupdate',()=>{const r=$(`.clip[data-id="${Play.id}"]`);if(!r||!player.duration)return;
  const k=Math.round(player.currentTime/player.duration*48);$$('.wave i',r).forEach((x,i)=>x.classList.toggle('on',i<k))});
function markPlaying(){$$('.clip').forEach(r=>{const on=+r.dataset.id===Play.id&&!player.paused;r.classList.toggle('playing',on);
  $('.pbtn',r).innerHTML=on?IC.pause:IC.play;if(!on)$$('.wave i',r).forEach(x=>x.classList.remove('on'))})}

  const c=REP.clips.find(x=>x.id===id),b=await clipBlob(id);if(!b)return;
  const d=new Date(c.t0),name=`sleep-${d.getFullYear()}${p2(d.getMonth()+1)}${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}${p2(d.getSeconds())}-${L(c)}.wav`;
  const f=new File([b],name,{type:'audio/wav'});

  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
}

  $('#tab-nights').innerHTML=ns.length?ns.map(nightRow).join(''):`<div class="card empty"><div class="big">🌙</div><b>${t('noNights')}</b><br>${t('noNights2')}</div>`;
}
async function renderTrends(){
  const ns=(await doneNights()).filter(n=>n.stats&&n.stats.score!=null).slice(0,14).reverse();
  const el=$('#tab-trends');
  if(ns.length<2){el.innerHTML=`<div class="card empty"><div class="big">📈</div>${t('noData')}</div>`;return}
  const l7=ns.slice(-7),avg=f=>l7.reduce((a,n)=>a+f(n.stats),0)/l7.length;
  const maxI=Math.max(50,...ns.map(n=>n.stats.snoreIdx));
  const bars=(f,max,col)=>`<div class="bars">${ns.map(n=>{const v=f(n.stats);return `<button class="col" data-act="night" data-v="${n.id}"><div class="bt"><span>${v}</span><i style="height:${Math.round(Math.max(3,v/max*100))}px;background:${col(v)}"></i></div><em>${new Date(n.start).getDate()}/${new Date(n.start).getMonth()+1}</em></button>`}).join('')}</div>`;
  el.innerHTML=`<div class="avgs">
    <div class="avg"><b class="c-${bandOf(Math.round(avg(s=>s.score)))}">${Math.round(avg(s=>s.score))}</b><small>${t('avgScore')}</small></div>
    <div class="avg"><b class="cS">${pct(avg(s=>s.snorePct))}</b><small>${t('avgSnore')}</small></div>
    <div class="avg"><b class="cT">${l7.reduce((a,n)=>a+n.stats.talkEp,0)}</b><small>${t('talkTotal')}</small></div>
    <div class="avg"><b class="cP">${l7.reduce((a,n)=>a+n.stats.pauses,0)}</b><small>${t('pauseTotal')}</small></div></div>
   <section class="card"><div class="cardHead"><h3>${bi('trScore')}</h3><span class="muted">${t('last14')}</span></div>
    ${bars(s=>s.score,100,v=>v>=80?'var(--g)':v>=60?'var(--y)':'var(--r)')}
    <div class="legend"><span><i style="background:var(--g)"></i>≥80</span><span><i style="background:var(--y)"></i>60–79</span><span><i style="background:var(--r)"></i>&lt;60</span></div></section>
   <section class="card"><div class="cardHead"><h3>${bi('trSnore')}</h3><span class="muted">${t('last14')}</span></div>
    ${bars(s=>s.snoreIdx,maxI,v=>['#E9C9A6','var(--snore-lt)','var(--snore)','#8E4614'][snoreCat(v)])}
    <div class="legend">${t('cat').map((c,i)=>`<span><i style="background:${['#E9C9A6','var(--snore-lt)','var(--snore)','#8E4614'][i]}"></i>${c} ${['<10','10–24','25–49','50+'][i]}</span>`).join('')}</div></section>
   <p class="disc">${t('disc')}</p>`;
}

/* ---------- 报告 ---------- */
const REP={n:null,clips:[],filter:'all',limit:60,morning:false};
async function openReport(id,morning){
  const n=await DB.get('nights',id);if(!n)return;
  REP.n=n;REP.clips=(await DB.byNight(id)).sort((a,b)=>a.t0-b.t0);REP.filter='all';REP.limit=60;REP.morning=!!morning;
  renderReport();const el=$('#report');el.scrollTop=0;el.classList.add('open');
}
function closeReport(){stopPlay();closeMenu();$('#report').classList.remove('open');render()}
function filtered(){return REP.clips.filter(c=>REP.filter==='all'||L(c)===REP.filter)}
function advice(s){
  const A=t('adv'),out=[];
  if(s.score==null)return out;
  if(s.pauses>=3)out.push(A.pause);
  if(s.snoreIdx>=10){out.push(A.side);out.push(A.alcohol);if(s.snoreIdx>=25)out.push(A.weight)}
  if(s.talkEp>=2)out.push(A.talk);
  if(s.noiseN/Math.max(1,s.hrs)>2)out.push(A.noise);
  if(s.hrs<6)out.push(A.short);
  if(!out.length)out.push(A.good);
  return out;
}
function renderReport(){
  const n=REP.n,s=computeStats(n,REP.clips),b=bandOf(s.score);
  const fresh=pickStats(s);if(JSON.stringify(fresh)!==JSON.stringify(n.stats)){n.stats=fresh;DB.put('nights',n)}
  const bandTxt={g:t('bandG'),y:t('bandY'),r:t('bandR'),n:t('bandN')}[b],verd={g:t('verdG'),y:t('verdY'),r:t('verdR'),n:t('verdN')}[b];
  const dn={snore:t('dedSnore'),pause:t('dedPause'),talk:t('dedTalk'),noise:t('dedNoise'),short:t('dedShort')};
  const ded=s.score==null?'':s.ded.length?s.ded.map(d=>`<span>${dn[d[0]]}<b>−${d[1]}</b></span>`).join(''):`<span class="ok">${t('dedNone')}<b>✓</b></span>`;
  const cnt=k=>REP.clips.filter(c=>k==='all'||L(c)===k).length;
  const cat=t('cat')[snoreCat(s.snoreIdx)];
  $('#report').innerHTML=`<div class="rTop"><button class="back" data-act="back">${IC.back}${t('back')}</button>
   <div class="rTitle"><b>${fmtDM(n.start)} · ${wk(n.start)}</b><small>${hm(n.start)} → ${hm(n.end||n.updated)}</small></div>
   <button class="iconBtn danger" data-act="delNight" aria-label="${t('del')}">${IC.trash}</button></div>
  <div class="wrap" style="padding-top:6px">
   ${REP.morning?`<div class="gm">${t('goodMorning')}</div>`:''}
   <section class="hero dark"><div class="scoreRow">${ring(s.score)}
     <div><span class="band ${b}"><i></i>${bandTxt}</span><p class="verd">${verd}</p></div></div>
     ${ded?`<div class="ded">${ded}</div>`:''}</section>
   <div class="stats">
    <div class="st k"><small>${t('bed')}</small><b>${durHM(s.bedMs)}</b><em>${hm(n.start)} – ${hm(n.end||n.updated)}</em></div>
    <div class="st s"><small>${t('snoring')}</small><b class="cS">${durS(s.snoreS)}</b><em>${pct(s.snorePct)}</em></div>
    <div class="st s"><small>${t('snoreIdx')}</small><b class="cS">${s.snoreIdx}</b><em>${cat}</em></div>
    <div class="st t"><small>${t('talk')}</small><b class="cT">${s.talkEp}${t('times')?' '+t('times'):''}</b><em>${durS(s.talkS)}</em></div>
    <div class="st p"><small>${t('pauses')}</small><b class="cP">${s.pauses}</b><em>${SET.lang==='zh'?'仅供参考':'for reference'}</em></div>
    <div class="st q"><small>${t('quiet')}</small><b>${durHM(s.lq)}</b><em>&nbsp;</em></div>
    <div class="st n"><small>${t('noise')}</small><b class="cN">${s.noiseN}</b><em>&nbsp;</em></div>
    <div class="st k"><small>${t('kept')}</small><b>${durS(s.keptS)}</b><em>${t('deleted',{p:pct(s.removed)})}</em></div>
   </div>
   <section class="card"><div class="cardHead"><h3>${bi('timeline')}</h3></div>${timeline(n,s)}
    <div class="legend"><span><i style="background:var(--snore)"></i>${t('lSnore')}</span><span><i style="background:var(--talk)"></i>${t('lTalk')}</span><span><i style="background:var(--noise)"></i>${t('lNoise')}</span><span><i style="background:var(--pause);border-radius:50%"></i>${t('pauses')}</span></div></section>
   ${s.score==null?'':`<section class="card"><div class="cardHead"><h3>${bi('advice')}</h3></div><ul class="adv">${advice(s).map(a=>`<li><span class="ai">${a[0]}</span><span>${a[1]}</span></li>`).join('')}</ul></section>`}
   <section class="card"><div class="cardHead"><h3>${bi('clips')}</h3></div>
    <div class="fchips">${['all','snore','talk','noise'].map(k=>`<button class="fchip ${REP.filter===k?'on':''}" data-act="filter" data-v="${k}">${k==='all'?t('all'):lname(k)} ${cnt(k)}</button>`).join('')}
     <button class="playAll" data-act="playAll">${IC.play}${t('playAll')}</button></div>
    <div id="clipList"></div></section>
   <button class="delBtn" data-act="delNight">${t('del')}</button>
   <p class="disc">${t('disc')}</p>
  </div>`;
  renderClips();animateIn($('#report'));
}
function timeline(n,s){
  const t0=n.start,t1=n.end||n.updated,span=Math.max(60000,t1-t0),W=1000,X=x=>Math.max(0,Math.min(W,(x-t0)/span*W));
  let g=`<svg viewBox="0 0 ${W} 150" preserveAspectRatio="none"><defs><pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#F6F1E6"/><line x1="0" y1="0" x2="0" y2="8" stroke="#E6DCC6" stroke-width="3"/></pattern>
   <linearGradient id="lvg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9A13E" stop-opacity=".45"/><stop offset="1" stop-color="#C9A13E" stop-opacity=".04"/></linearGradient></defs>`;
  if(n.delay)g+=`<rect x="0" y="0" width="${X(t0+n.delay)}" height="104" fill="url(#hatch)"/>`;
  for(const gp of n.gaps||[])g+=`<rect x="${X(gp[0])}" y="0" width="${Math.max(2,X(gp[1])-X(gp[0]))}" height="104" fill="#E9E5DC"/>`;
  for(const v of[10,20,30])g+=`<line x1="0" x2="${W}" y1="${100-v/34*92}" y2="${100-v/34*92}" stroke="#EFE8DA" vector-effect="non-scaling-stroke"/>`;
  const lv=(n.levels||[]).slice().sort((a,b)=>a[0]-b[0]);
  if(lv.length){const pts=lv.map(l=>[X(t0+(l[0]+.5)*BIN),100-Math.min(34,Math.max(0,l[1]-6))/34*92]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
    g+=`<path d="${line} L${pts[pts.length-1][0].toFixed(1)} 100 L${pts[0][0].toFixed(1)} 100Z" fill="url(#lvg)"/><path d="${line}" fill="none" stroke="#B8912F" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`}
  g+=`<line x1="0" x2="${W}" y1="100" y2="100" stroke="#E2D8C4" vector-effect="non-scaling-stroke"/>`;
  for(const c of REP.clips){const x=X(c.t0),w=Math.max(7,c.dur*1000/span*W);
    g+=`<rect class="ev" data-act="tl" data-v="${c.id}" x="${x.toFixed(1)}" y="${L(c)==='snore'?110:L(c)==='talk'?122:134}" width="${w.toFixed(1)}" height="12" rx="2" fill="${LCOL[L(c)]}"/>`}
  for(const p of s.pauseAt)g+=`<path d="M${X(p).toFixed(1)} 104 l-6 -9 h12z" fill="var(--pause)"/>`;
  g+='</svg>';
  let ticks='';const H=3.6e6;const stepH=span>9*H?2:1;let h0=new Date(t0);h0.setMinutes(0,0,0);let ht=h0.getTime()+H;
  for(;ht<t1;ht+=H*stepH){const x=X(ht)/W*100;if(x>4&&x<96)ticks+=`<span style="left:${x}%">${hm(ht)}</span>`}
  return `<div class="tl">${g}<div class="tlx">${ticks}</div></div>`;
}
function renderClips(){
  const list=filtered(),show=list.slice(0,REP.limit),inten=t('loudL');
  $('#clipList').innerHTML=show.map(c=>{const l=L(c),it=l==='snore'?`<span class="int">${inten[c.mean>=25?2:c.mean>=15?1:0]}</span>`:'';
   return `<div class="clip" data-id="${c.id}" style="--c:${LCOL[l]}">
    <button class="pbtn" data-act="play" data-v="${c.id}" ${c.gone?'disabled':''} aria-label="play">${IC.play}</button>
    <div><div class="cTop"><b>${hm(c.t0)}</b><button class="pill ${l}" data-act="menu" data-v="${c.id}">${lname(l)}${c.label?'':` <span class="auto">· ${t('auto')}</span>`} ▾</button>${it}<span class="cd">${mmss(c.dur)}</span>${c.gone?`<span class="int">${t('gone')}</span>`:''}</div>
     <div class="wave">${(c.env||[]).map(v=>`<i style="height:${Math.max(8,v*100)}%"></i>`).join('')}</div></div>
    <button class="star ${c.star?'on':''}" data-act="star" data-v="${c.id}" aria-label="star">${IC.star}</button></div>`}).join('')+
   (list.length>REP.limit?`<button class="moreBtn" data-act="more">${t('showMore')} (${list.length-REP.limit})</button>`:'');
  markPlaying();
}
let menuEl=null;
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null}}
function openMenu(btn,id){
  closeMenu();const c=REP.clips.find(x=>x.id===id),l=L(c),r=btn.getBoundingClientRect();
  const m=document.createElement('div');m.className='menu';
  m.innerHTML=['snore','talk','noise'].map(k=>`<button class="${k===l?'cur':''}" data-act="label" data-id="${id}" data-v="${k}"><span class="dot" style="background:${LCOL[k]}"></span>${lname(k)}${k===l?' ✓':''}</button>`).join('')+
   `<hr>${c.gone?'':`<button data-act="share" data-v="${id}">⬇️ ${t('save')}</button>`}<button data-act="delClip" data-v="${id}" class="danger">🗑 ${t('delClip')}</button>`;
  document.body.appendChild(m);menuEl=m;
  const mh=m.offsetHeight,below=r.bottom+6+mh<innerHeight;
  m.style.left=Math.min(innerWidth-230,Math.max(10,r.left))+'px';m.style.top=(below?r.bottom+6:r.top-6-mh)+'px';
  m.style.transformOrigin=(below?'top ':'bottom ')+'left';
}
async function relabel(id,v){const c=REP.clips.find(x=>x.id===id);c.label=v===c.auto?null:v;await DB.put('clips',c);closeMenu();renderReport()}
async function toggleStar(id){const c=REP.clips.find(x=>x.id===id);c.star=!c.star;await DB.put('clips',c);const b=$(`.star[data-v="${id}"]`);b&&b.classList.toggle('on',c.star);if(c.star)toast('★ '+t('star'))}
async function delClip(id){closeMenu();if(!confirm(t('delClipQ')))return;if(Play.id===id)stopPlay();await DB.del('clips',id);await DB.del('audio',id);REP.clips=REP.clips.filter(c=>c.id!==id);renderReport()}
async function delNight(){if(!confirm(t('delQ')))return;const id=REP.n.id;for(const c of REP.clips){await DB.del('clips',c.id);await DB.del('audio',c.id)}await DB.del('nights',id);REP.n=null;closeReport()}

/* ---------- 设定 ---------- */
function sseg(k,opts){return `<div class="sseg">${opts.map(o=>`<button class="${SET[k]===o[0]?'on':''}" data-act="set" data-k="${k}" data-v="${o[0]}">${o[1]}</button>`).join('')}</div>`}
async function renderSheet(){
  let used='';try{if(navigator.storage&&navigator.storage.estimate){const e=await navigator.storage.estimate();used=t('used',{u:(e.usage/1048576).toFixed(1)+' MB'})}}catch(e){}
  $('#sheetBox').innerHTML=`<div class="grab"></div><div class="sheetHead"><h3>${t('settings')} <span class="sec">${SET.lang==='zh'?'Settings':'设定'}</span></h3><button class="done" data-act="closeSheet">${t('done')}</button></div>
   <div class="row"><label>${t('sens')}</label>${sseg('sens',[['low',t('sLow')],['mid',t('sMid')],['high',t('sHigh')]])}<p>${t('sensP')}</p></div>
   <div class="row"><label>${t('delay')}</label>${sseg('delay',[[0,t('noDelay')],[10,'10 '+t('minS')],[20,'20 '+t('minS')],[30,'30 '+t('minS')]])}<p>${t('delayP')}</p></div>
   <div class="row"><label>${t('autoStop')}</label>${sseg('autoStop',[[0,t('off')],[6,'6'+t('hU')],[7,'7'+t('hU')],[8,'8'+t('hU')],[9,'9'+t('hU')]])}<p>${t('autoP')}</p></div>
   <div class="row"><label>${t('keep')}</label>${sseg('keep',[[7,'7 '+t('nightsU')],[14,'14 '+t('nightsU')],[30,'30 '+t('nightsU')],[0,t('keepAll')]])}<p>${t('keepP')}</p></div>
   <div class="row"><label>${t('imp')}</label><button class="btn2" data-act="import">📁 ${t('impBtn')}</button><p>${t('impP')}</p></div>
   <div class="row"><label>${t('storage')}</label><p style="margin-top:0">${used}</p><button class="btn2 danger" data-act="wipe" style="margin-top:10px">${t('wipe')}</button></div>`;
}
function openSheet(){renderSheet();$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open')}
async function wipe(){if(!confirm(t('wipeQ')))return;stopPlay();await DB.clear('clips');await DB.clear('audio');await DB.clear('nights');closeSheet();toast(t('wiped'));render()}

/* ---------- 事件 ---------- */
document.addEventListener('click',async e=>{
  if(menuEl&&!e.target.closest('.menu')&&!e.target.closest('[data-act="menu"]'))closeMenu();
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v;
  switch(a){
   case 'tab':setTab(v);break;
   case 'lang':SET.lang=v;saveSet();applyLang();break;
   case 'start':startRec();break;
   case 'settings':openSheet();break;
   case 'closeSheet':closeSheet();render();break;
   case 'set':SET[el.dataset.k]=isNaN(+v)?v:+v;saveSet();renderSheet();break;
   case 'night':openReport(+v);break;
   case 'back':closeReport();break;
   case 'play':togglePlay(+v);break;
   case 'playAll':playAll();break;
   case 'filter':REP.filter=v;REP.limit=60;$$('.fchip').forEach(b=>b.classList.toggle('on',b.dataset.v===v));renderClips();break;
   case 'menu':if(menuEl){closeMenu()}else openMenu(el,+v);break;
   case 'label':relabel(+el.dataset.id,v);break;
   case 'star':toggleStar(+v);break;
   case 'share':closeMenu();shareClip(+v);break;
   case 'delClip':delClip(+v);break;
   case 'delNight':delNight();break;
   case 'import':$('#fileIn').click();break;
   case 'wipe':wipe();break;
   case 'more':REP.limit+=60;renderClips();break;
   case 'tl':{const id=+v;if(REP.filter!=='all'){REP.filter='all';$$('.fchip').forEach(b=>b.classList.toggle('on',b.dataset.v==='all'))}
     const i=REP.clips.findIndex(c=>c.id===id);if(i>=REP.limit){REP.limit=i+20}renderClips();
     const r=$(`.clip[data-id="${id}"]`);if(r){r.scrollIntoView({block:'center',behavior:reduced?'auto':'smooth'});r.classList.remove('flash');void r.offsetWidth;r.classList.add('flash')}
     if(!REP.clips[i].gone){Play.queue=[];playClip(id)}break}
   case 'skipDelay':if(Rec.on){Rec.night.delay=Date.now()-Rec.night.start;tick()}break;
   case 'resume':resumeRec();break;
  }
});
window.addEventListener('scroll',closeMenu,{passive:true});
$('#report').addEventListener('scroll',closeMenu,{passive:true});

/* Netlify 免费方案的徽章：侦测到就把内容让开 */
(()=>{let k=0;const iv=setInterval(()=>{if(document.getElementById('nl-badge-frame')){document.body.classList.add('has-badge');clearInterval(iv)}if(++k>20)clearInterval(iv)},500)})();

/* ================= 启动 ================= */
(async()=>{
  await DB.open();
  // 上次录音没正常结束（关掉 App / 没电）→ 用最后存档的时间收尾
  for(const n of await DB.all('nights'))if(!n.end){n.end=n.updated||n.start;if(n.end-n.start<60000){for(const c of await DB.byNight(n.id)){await DB.del('clips',c.id);await DB.del('audio',c.id)}await DB.del('nights',n.id)}else{await finalize(n);toast(t('recovered'),4500)}}
  applyLang();setTab('tonight');
  if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
window.SS={Engine,classify,computeStats,importFile,DB,Rec};
